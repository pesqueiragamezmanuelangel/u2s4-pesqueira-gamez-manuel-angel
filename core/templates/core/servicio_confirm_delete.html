<h1 class="text-2xl font-bold mb-4">¿Eliminar "{{ servicio.titulo }}"?</h1>
<!-- este formulario no tiene campos de texto: solo confirma la acción -->
<form method="POST">
  {% csrf_token %}
  <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded-lg">
    Sí, eliminar
  </button>
  <!-- href de vuelta a la lista, para cancelar sin borrar nada -->
  <a href="{% url 'servicios' %}" class="ml-3 text-slate-600 underline">Cancelar</a>
</form>
